<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Monitor</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --text: #e6e6e6;
    --muted: #9aa0ab;
    --low: #3ddc84;
    --medium: #f5c542;
    --high: #f57c42;
    --critical: #f54242;
    --border: #2a2d3a;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 24px;
  }
  .device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .device-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .device-card h2 {
    font-size: 1rem;
    margin: 0 0 8px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edit-icon {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.8rem;
    border: none;
    background: none;
    padding: 0;
  }
  .edit-icon:hover { color: var(--accent); }
  .nickname-input {
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.95rem;
    width: 100%;
  }
  .device-card .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .device-card .row span:last-child {
    text-align: right;
    word-break: break-word;
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.Low { background: rgba(61,220,132,0.15); color: var(--low); }
  .badge.Medium { background: rgba(245,197,66,0.15); color: var(--medium); }
  .badge.High { background: rgba(245,124,66,0.15); color: var(--high); }
  .badge.Critical { background: rgba(245,66,66,0.15); color: var(--critical); }
  .reasons {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .reasons ul {
    margin: 4px 0 0 0;
    padding-left: 18px;
  }
  #status { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
</style>
</head>
<body>

<h1>Network Monitor</h1>
<p class="subtitle">Devices seen on your network</p>
<div id="status">Loading devices...</div>
<div class="device-grid" id="device-grid"></div>

<script>
const API_URL = "http://127.0.0.1:8000/devices";

async function saveNickname(deviceId, newNickname) {
  try {
    await fetch(`${API_URL}/${deviceId}/nickname`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname: newNickname })
    });
  } catch (err) {
    alert("Could not save nickname: " + err.message);
  }
  loadDevices();
}

function startEditing(deviceId, currentName) {
  const titleEl = document.getElementById(`title-${deviceId}`);
  titleEl.innerHTML = `
    <input type="text" class="nickname-input" id="input-${deviceId}" value="${currentName}" />
  `;
  const input = document.getElementById(`input-${deviceId}`);
  input.focus();
  input.select();

  const finish = () => {
    const newValue = input.value.trim();
    if (newValue) saveNickname(deviceId, newValue);
    else loadDevices();
  };

  input.addEventListener("blur", finish);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") finish();
  });
}

async function loadDevices() {
  const statusEl = document.getElementById("status");
  const grid = document.getElementById("device-grid");

  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error("API returned " + response.status);
    const devices = await response.json();

    grid.innerHTML = "";

    if (devices.length === 0) {
      statusEl.textContent = "No devices found yet.";
      return;
    }

    statusEl.textContent = devices.length + " device(s) found";

    devices.forEach(d => {
      const card = document.createElement("div");
      card.className = "device-card";

      let reasonsHtml = "";
      if (d.risk_reasons && d.risk_level !== "Low") {
        const reasonList = d.risk_reasons.split(";").map(r => r.trim()).filter(Boolean);
        reasonsHtml = `
          <div class="reasons">
            Why this risk level:
            <ul>${reasonList.map(r => `<li>${r}</li>`).join("")}</ul>
          </div>
        `;
      }

      const displayName = d.nickname || d.hostname || "Unknown device";

      card.innerHTML = `
        <h2 id="title-${d.id}">
          <span>${displayName}</span>
          <button class="edit-icon" onclick="startEditing(${d.id}, '${displayName.replace(/'/g, "\\'")}')">✎ rename</button>
        </h2>
        <div class="row"><span>IP</span><span>${d.ip_address || "-"}</span></div>
        <div class="row"><span>MAC</span><span>${d.mac_address || "-"}</span></div>
        <div class="row"><span>Vendor</span><span>${d.vendor || "Unknown"}</span></div>
        <div class="row"><span>Type</span><span>${d.device_type || "Unknown"}</span></div>
        <div class="row"><span>OS guess</span><span>${d.os_guess || "Unknown"}</span></div>
        <div class="row"><span>Open ports</span><span>${d.open_ports || "None found"}</span></div>
        <div class="row"><span>Last seen</span><span>${new Date(d.last_seen).toLocaleString()}</span></div>
        <div class="row"><span>Risk</span><span class="badge ${d.risk_level}">${d.risk_level}</span></div>
        ${reasonsHtml}
      `;
      grid.appendChild(card);
    });
  } catch (err) {
    statusEl.textContent = "Could not load devices: " + err.message;
  }
}

loadDevices();
setInterval(loadDevices, 10000);
</script>

</body>
</html>
